<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>店頭ポスター(QRコード)</title>
  <style>
    :root { --accent: #2a7fba; --text: #1f2a36; --muted: #5b6672; --border: #c9cfd4; --bg: #f4f6f8; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere;
    }

    /* ----- 設定欄(印刷されません) ----- */
    .panel { max-width: 720px; margin: 16px auto; padding: 16px 20px; background: #fff; border: 1px solid var(--border); border-radius: 8px; }
    .panel h1 { margin: 0 0 4px; font-size: 18px; }
    .panel p { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
    .panel fieldset { margin: 0 0 12px; padding: 0; border: none; }
    .panel legend { padding: 0; font-size: 14px; font-weight: bold; }
    .panel .checks { display: flex; flex-wrap: wrap; gap: 4px 16px; }
    .panel label { font-size: 15px; cursor: pointer; }
    .panel input[type="text"] { width: 100%; padding: 8px 10px; font: inherit; border: 1px solid var(--border); border-radius: 4px; }
    .panel button {
      padding: 12px 24px; font: inherit; font-weight: bold; color: #fff;
      background: var(--accent); border: none; border-radius: 8px; cursor: pointer;
    }

    /* ----- ポスター(A4たて) ----- */
    .poster {
      width: 210mm; max-width: calc(100% - 32px); min-height: 297mm;
      margin: 0 auto 32px; padding: 16mm 14mm; background: #fff;
      border: 1px solid var(--border); display: flex; flex-direction: column;
    }
    .poster-head { text-align: center; padding-bottom: 8mm; border-bottom: 3px solid var(--accent); }
    .poster-logo { display: block; max-height: 22mm; max-width: 60%; margin: 0 auto 4mm; object-fit: contain; }
    .poster-shop { margin: 0 0 2mm; font-size: 16pt; color: var(--muted); }
    .poster-title { margin: 0; font-size: 30pt; line-height: 1.35; color: var(--accent); }
    .poster-lead { margin: 4mm 0 0; font-size: 14pt; }
    .codes { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8mm; align-content: center; padding: 10mm 0; }
    .codes.single { grid-template-columns: 1fr; }
    .code { text-align: center; padding: 6mm 4mm; border: 2px solid var(--border); border-radius: 4mm; break-inside: avoid; }
    .code-icon { font-size: 22pt; line-height: 1; }
    .code-name { margin: 1mm 0 3mm; font-size: 17pt; font-weight: bold; }
    .code svg { display: block; width: 52mm; height: 52mm; max-width: 100%; margin: 0 auto; }
    .codes.single .code svg { width: 90mm; height: 90mm; }
    .code-url { margin: 3mm 0 0; font-size: 7.5pt; color: var(--muted); word-break: break-all; }
    .steps { display: flex; justify-content: center; gap: 6mm; margin: 0; padding: 6mm 0 0; list-style: none; border-top: 1px solid var(--border); font-size: 12pt; }
    .steps li { flex: 1; text-align: center; }
    .steps strong { display: block; font-size: 16pt; color: var(--accent); }
    .poster-foot { margin: 5mm 0 0; text-align: center; font-size: 11pt; color: var(--muted); }

    @media (max-width: 640px) {
      .poster { padding: 24px 16px; min-height: 0; }
      .poster-title { font-size: 24px; }
      .poster-lead, .steps { font-size: 14px; }
      .codes { grid-template-columns: 1fr; }
      .steps { flex-direction: column; gap: 8px; }
    }

    @page { size: A4 portrait; margin: 0; }
    @media print {
      body { background: #fff; }
      .panel { display: none !important; }
      html, body { height: auto; }
      /* 用紙の高さより少しだけ小さくして、2ページ目にはみ出さないようにする */
      .poster { width: 210mm; max-width: none; height: 295mm; min-height: 0; margin: 0; border: none; overflow: hidden; break-after: avoid; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <!-- 設定欄(画面だけに表示され、印刷はされません) -->
  <div class="panel">
    <h1>店頭ポスター(QRコード)を作る</h1>
    <p>載せる内容を選んで「印刷する」を押してください。<wbr>印刷画面で「PDFに保存」を選ぶと、PDFにもできます。</p>
    <fieldset>
      <legend>載せるQRコード</legend>
      <div class="checks" id="formChecks"></div>
    </fieldset>
    <fieldset>
      <legend>見出し</legend>
      <input type="text" id="titleInput" maxlength="30" value="買い替えのご相談はこちら">
    </fieldset>
    <fieldset>
      <legend>説明文</legend>
      <input type="text" id="leadInput" maxlength="60" value="スマホでQRコードを読み取って、かんたんな質問に答えるだけ">
    </fieldset>
    <button type="button" id="printBtn">印刷する</button>
  </div>

  <!-- ポスター本体 -->
  <div class="poster">
    <div class="poster-head">
      <img class="poster-logo" id="logo" alt="" hidden>
      <p class="poster-shop" id="shop" hidden></p>
      <h2 class="poster-title" id="title"></h2>
      <p class="poster-lead" id="lead"></p>
    </div>
    <div class="codes" id="codes"></div>
    <ol class="steps">
      <li><strong>1</strong>スマホのカメラで<wbr>QRコードを読み取る</li>
      <li><strong>2</strong>質問に答えて送信<wbr>(約1〜3分)</li>
      <li><strong>3</strong>担当者から<wbr>ご提案をお届けします</li>
    </ol>
    <p class="poster-foot" id="foot" hidden></p>
  </div>

  <script src="config.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script>
    (function () {
      "use strict";
      var config = window.HEARING_CONFIG || {};
      var $ = function (id) { return document.getElementById(id); };
      var FORMS = [
        { key: "pc", icon: "💻", name: "パソコン" },
        { key: "phone", icon: "📱", name: "スマートフォン" },
        { key: "tablet", icon: "📲", name: "タブレット" },
        { key: "plan", icon: "📶", name: "携帯料金の見直し" },
      ];
      // このページと同じ場所にある index.html を、QRコードの行き先にする
      var base = new URL("./", location.href).href;

      // お店の色・店名・ロゴ
      var color = /^#?([0-9a-f]{6})$/i.exec(String(config.BRAND_COLOR || "").trim());
      if (color) document.documentElement.style.setProperty("--accent", "#" + color[1]);
      if (config.SHOP_NAME) { $("shop").textContent = config.SHOP_NAME; $("shop").hidden = false; }
      if (config.LOGO_URL) {
        $("logo").src = config.LOGO_URL;
        $("logo").alt = config.SHOP_NAME || "";
        $("logo").hidden = false;
        $("logo").onerror = function () { $("logo").hidden = true; };
      }
      var foot = [config.SHOP_TEL ? "お電話でのご相談:" + config.SHOP_TEL : "", config.SHOP_HOURS ? "受付時間:" + config.SHOP_HOURS : ""].filter(String);
      if (foot.length) { $("foot").textContent = foot.join(" / "); $("foot").hidden = false; }

      FORMS.forEach(function (f) {
        var label = document.createElement("label");
        var box = document.createElement("input");
        box.type = "checkbox"; box.value = f.key; box.checked = true;
        box.addEventListener("change", render);
        label.appendChild(box);
        label.appendChild(document.createTextNode(" " + f.name));
        $("formChecks").appendChild(label);
      });

      function render() {
        $("title").textContent = $("titleInput").value;
        $("lead").textContent = $("leadInput").value;
        var picked = Array.prototype.filter.call(document.querySelectorAll("#formChecks input"), function (b) { return b.checked; })
          .map(function (b) { return b.value; });
        var codes = $("codes");
        codes.innerHTML = "";
        codes.className = "codes" + (picked.length === 1 ? " single" : "");
        FORMS.filter(function (f) { return picked.indexOf(f.key) !== -1; }).forEach(function (f) {
          var url = base + "?type=" + f.key;
          var qr = qrcode(0, "M");
          qr.addData(url);
          qr.make();
          var card = document.createElement("div");
          card.className = "code";
          card.innerHTML =
            '<div class="code-icon" aria-hidden="true">' + f.icon + "</div>" +
            '<p class="code-name"></p>' +
            qr.createSvgTag({ cellSize: 4, margin: 8, scalable: true }) +
            '<p class="code-url"></p>';
          card.querySelector(".code-name").textContent = f.name;
          card.querySelector(".code-url").textContent = url;
          card.querySelector("svg").setAttribute("role", "img");
          card.querySelector("svg").setAttribute("aria-label", f.name + "のヒアリングシートのQRコード");
          codes.appendChild(card);
        });
      }

      $("titleInput").addEventListener("input", render);
      $("leadInput").addEventListener("input", render);
      $("printBtn").addEventListener("click", function () { window.print(); });
      render();
    })();
  </script>
</body>
</html>
